<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planificador de Monitoreos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#0f766e;--accent-soft:#ccfbf1;
--warn:#b45309;--warn-soft:#fef3c7;--bad:#b91c1c;--bad-soft:#fee2e2;--ok:#15803d;--ok-soft:#dcfce7;--input:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--panel:#1a1f25;--text:#e5e7eb;--muted:#9ca3af;--line:#2d333b;
--accent:#2dd4bf;--accent-soft:#134e4a;--warn:#fbbf24;--warn-soft:#422006;--bad:#f87171;--bad-soft:#450a0a;--ok:#4ade80;
--ok-soft:#052e16;--input:#0f1317}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);
position:sticky;top:0;z-index:1000;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:650}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;padding:7px 11px;border-radius:6px;color:var(--muted);cursor:pointer;font:inherit}
nav button:hover{background:var(--bg)}
nav button.activo{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{padding:20px;max-width:1400px;margin:0 auto}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:18px 0 8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.entre{justify-content:space-between}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
button,.boton{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);
color:var(--text);cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.boton:hover{border-color:var(--accent)}
button.primario{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){button.primario{color:#042f2e}}
button.peligro{color:var(--bad)}
button.mini{padding:2px 7px;font-size:12px}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--text)}
input[type=checkbox]{width:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
tr.clic{cursor:pointer}tr.clic:hover td{background:var(--bg)}
.tabla-scroll{overflow-x:auto}
.muted{color:var(--muted)}.chico{font-size:12px}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--bg);border:1px solid var(--line);margin:1px}
.vencido{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.proximo{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.aviso{background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:6px;margin:4px 0;font-size:13px}
.error{background:var(--bad-soft);color:var(--bad);padding:8px 12px;border-radius:6px;margin:6px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-size:20px}
.kpi span{color:var(--muted);font-size:12px}
.mapa{height:420px;border-radius:8px;border:1px solid var(--line)}
.mapa-mini{height:260px;border-radius:8px;border:1px solid var(--line);margin-top:6px}
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--panel);color:var(--text);
width:min(760px,96vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg-cab{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dlg-cuerpo{padding:14px 18px;overflow:auto;max-height:calc(92vh - 130px)}
.dlg-pie{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 16px}
@media (max-width:640px){.form{grid-template-columns:1fr}}
.form label{display:flex;flex-direction:column;gap:3px;font-size:13px}
.form label>span{color:var(--muted)}
.form .ancho{grid-column:1/-1}
.form input,.form select,.form textarea{width:100%}
.checks{display:flex;flex-wrap:wrap;gap:4px 12px}
.checks label{flex-direction:row;align-items:center;gap:4px;color:var(--text)}
.dia{border-left:4px solid var(--c);padding-left:12px}
.dia-cab{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start}
.tareas{width:100%;table-layout:fixed}.tareas td{padding:4px 6px}
.tareas td:nth-child(1){width:64px}.tareas td:nth-child(2){width:30%}.tareas td:nth-child(3){width:130px}
.tareas td:nth-child(4){width:110px}.tareas td:nth-child(6){width:150px}.tareas select{max-width:100%}
.tareas input,.tareas select{padding:3px 6px;font-size:13px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin:6px 0}
.linea-tiempo td{padding:2px 6px;font-size:12px;border:0}
#toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;
opacity:0;transition:opacity .2s;z-index:3000;max-width:420px;pointer-events:none}
#toast.visible{opacity:1}
.cargando{opacity:.6;pointer-events:none}
.sucio{color:var(--warn);font-weight:600}
</style>
</head>
<body>
<header>
  <h1>Planificador de Monitoreos</h1>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<dialog id="dlg"><div class="dlg-cab"><b id="dlg-titulo"></b><button class="mini" onclick="dlg.close()">✕</button></div>
<div class="dlg-cuerpo" id="dlg-cuerpo"></div><div class="dlg-pie" id="dlg-pie"></div></dialog>
<div id="toast"></div>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const h = (tag, attrs = {}, ...hijos) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "html") e.innerHTML = v;
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const x of hijos.flat()) if (x != null) e.append(x.nodeType ? x : document.createTextNode(x));
  return e;
};
const dlg = $("#dlg");
let E = null, D = null;  // esquemas y datos
const estado = {vista: "inicio", prog: null, sucio: false};

function toast(msg, ms = 3500) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("visible");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("visible"), ms);
}
async function api(metodo, ruta, cuerpo) {
  const r = await fetch("/api/" + ruta, {method: metodo, headers: {"Content-Type": "application/json"},
    body: cuerpo === undefined ? undefined : JSON.stringify(cuerpo)});
  const j = await r.json().catch(() => ({error: "Respuesta no válida del servidor"}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function conCarga(el, fn) {
  el?.classList.add("cargando");
  try { return await fn(); } catch (e) { toast("⚠ " + e.message, 6000); throw e; }
  finally { el?.classList.remove("cargando"); }
}
const moneda = () => D.config.moneda;
const dinero = n => `${moneda()} ${Number(n).toLocaleString("es-CO", {maximumFractionDigits: 0})}`;
const fechaCorta = iso => iso ? iso.split("-").reverse().join("/") : "—";

// ------------------------------------------------------------------------- //
// Navegación
// ------------------------------------------------------------------------- //
const VISTAS = [["inicio", "Inicio"], ["puntos", "Puntos"], ["personal", "Personal"], ["vehiculos", "Vehículos"],
  ["equipos", "Equipos"], ["alojamientos", "Alojamientos"], ["config", "Configuración"], ["planificar", "Planificar"],
  ["programaciones", "Programaciones"]];
function pintarNav() {
  $("#nav").replaceChildren(...VISTAS.map(([k, t]) =>
    h("button", {class: estado.vista === k || (k === "programaciones" && estado.vista === "plan") ? "activo" : "",
      onclick: () => ir(k)}, t)));
}
function ir(vista, extra) {
  if (estado.vista === "plan" && estado.sucio && vista !== "plan" &&
      !confirm("Hay cambios sin guardar en la programación. ¿Salir de todos modos?")) return;
  estado.vista = vista; estado.sucio = false;
  if (extra) Object.assign(estado, extra);
  location.hash = vista === "plan" ? "plan/" + estado.prog : vista;
  pintarNav();
  const m = $("#main"); m.replaceChildren();
  Promise.resolve(({inicio: vInicio, config: vConfig, planificar: vPlanificar, programaciones: vProgramaciones,
    plan: vPlan}[vista] || vEntidad)(m, vista)).catch(e => m.append(h("div", {class: "error"}, e.message)));
}
window.addEventListener("beforeunload", e => { if (estado.sucio) e.preventDefault(); });

// ------------------------------------------------------------------------- //
// Formularios genéricos a partir de los esquemas
// ------------------------------------------------------------------------- //
function expandirFechas(txt) {
  const out = new Set();
  for (let x of txt.split(/[,\s]+/).filter(Boolean)) {
    if (x.includes("..")) {
      let [a, b] = x.split("..").map(s => new Date(s.trim() + "T12:00"));
      if (isNaN(a) || isNaN(b)) throw new Error(`Rango no válido: ${x}`);
      for (; a <= b; a.setDate(a.getDate() + 1)) out.add(a.toISOString().slice(0, 10));
    } else {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(x)) throw new Error(`Fecha no válida: ${x} (use AAAA-MM-DD)`);
      out.add(x);
    }
  }
  return [...out].sort();
}
function control(c, valor) {
  const id = "f_" + c.nombre;
  let el, get;
  switch (c.tipo) {
    case "bool":
      el = h("input", {type: "checkbox", id, checked: !!valor}); get = () => el.checked; break;
    case "int": case "float":
      el = h("input", {type: "number", id, step: c.tipo === "int" ? "1" : "any", value: valor ?? ""});
      get = () => { if (el.value === "") { if (c.requerido) throw new Error(`'${c.etiqueta}' es obligatorio`); return c.tipo === "int" ? 0 : 0.0; }
        return c.tipo === "int" ? parseInt(el.value) : parseFloat(el.value); };
      break;
    case "date": case "time":
      el = h("input", {type: c.tipo, id, value: valor || ""}); get = () => el.value; break;
    case "select": {
      const ops = c.opciones.map(o => Array.isArray(o) ? o : [o, o]);
      el = h("select", {id}, ops.map(([v, t], i) => h("option", {value: i, selected: v === valor}, String(t))));
      get = () => ops[+el.value][0]; break;
    }
    case "multi": case "dias": {
      const ops = c.tipo === "dias" ? E.dias_semana.map((t, i) => [i, t]) : c.opciones.map(o => [o, o]);
      const cajas = ops.map(([v, t]) => [v, h("input", {type: "checkbox", checked: (valor || []).includes(v)})]);
      el = h("div", {class: "checks"}, cajas.map(([v, cb], i) => h("label", {}, cb, String(ops[i][1]))));
      get = () => cajas.filter(([, cb]) => cb.checked).map(([v]) => v); break;
    }
    case "tags": {
      el = h("input", {id, value: (valor || []).join(", "), list: "dl_tipos", placeholder: "separados por comas"});
      get = () => el.value.split(",").map(s => s.trim().toLowerCase()).filter(Boolean); break;
    }
    case "dates":
      el = h("textarea", {id, rows: 2, placeholder: "2026-10-05, 2026-10-10..2026-10-14"}, (valor || []).join(", "));
      get = () => expandirFechas(el.value); break;
    default:
      el = h("input", {id, value: valor ?? ""});
      get = () => { if (c.requerido && !el.value.trim()) throw new Error(`'${c.etiqueta}' es obligatorio`); return el.value; };
  }
  const ancho = ["multi", "dates", "dias"].includes(c.tipo) ? "ancho" : "";
  const etiqueta = h("span", {}, c.etiqueta + (c.requerido ? " *" : ""));
  const label = c.tipo === "bool"
    ? h("label", {class: ancho, style: "flex-direction:row;align-items:center;gap:6px"}, el, h("span", {}, c.etiqueta))
    : h("label", {class: ancho}, etiqueta, el, c.ayuda ? h("small", {class: "muted"}, c.ayuda) : null);
  return {c, el, label, get};
}
// Mapa para elegir coordenadas con un clic; enlaza dos controles numéricos.
function selectorCoordenadas(cLat, cLon, extras = []) {
  const div = h("div", {class: "mapa-mini ancho"});
  const nota = h("small", {class: "muted ancho"}, "Haga clic en el mapa para fijar la ubicación.");
  setTimeout(() => {
    if (!window.L) { div.replaceWith(h("small", {class: "muted"}, "(mapa no disponible sin internet)")); return; }
    const lat = parseFloat(cLat.el.value), lon = parseFloat(cLon.el.value);
    const centro = !isNaN(lat) && (lat || lon) ? [lat, lon] : [D.config.base_lat, D.config.base_lon];
    const m = L.map(div).setView(centro, 11); capaBase(m);
    for (const [la, lo, t] of extras) L.circleMarker([la, lo], {radius: 4, color: "#888"}).addTo(m).bindTooltip(t);
    const marca = L.marker(centro, {draggable: true}).addTo(m);
    const fijar = ll => { cLat.el.value = ll.lat.toFixed(6); cLon.el.value = ll.lng.toFixed(6); marca.setLatLng(ll); };
    m.on("click", e => fijar(e.latlng)); marca.on("dragend", () => fijar(marca.getLatLng()));
    for (const c of [cLat, cLon]) c.el.addEventListener("change", () => {
      const a = parseFloat(cLat.el.value), b = parseFloat(cLon.el.value);
      if (!isNaN(a) && !isNaN(b)) { marca.setLatLng([a, b]); m.panTo([a, b]); } });
  }, 50);
  return [div, nota];
}
function capaBase(m) {
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom: 19, attribution: "© OpenStreetMap"}).addTo(m);
}
function construirForm(campos, datos, contenedor, extrasMapa = []) {
  const ctrls = campos.map(c => control(c, datos[c.nombre]));
  const porNombre = Object.fromEntries(ctrls.map(x => [x.c.nombre, x]));
  const basicos = h("div", {class: "form"}), avanzados = h("div", {class: "form"});
  for (const x of ctrls) {
    (x.c.avanzado ? avanzados : basicos).append(x.label);
    const m = x.c.nombre.match(/^(.*)lon$/);
    if (m && porNombre[m[1] + "lat"]) (x.c.avanzado ? avanzados : basicos).append(...selectorCoordenadas(porNombre[m[1] + "lat"], x, extrasMapa));
  }
  contenedor.append(basicos);
  if (avanzados.children.length) contenedor.append(h("details", {}, h("summary", {}, "Opciones avanzadas"), avanzados));
  return () => Object.fromEntries(ctrls.map(x => [x.c.nombre, x.get()]));
}
function abrirDialogo(titulo, cuerpo, botones) {
  $("#dlg-titulo").textContent = titulo;
  $("#dlg-cuerpo").replaceChildren(...[cuerpo].flat());
  $("#dlg-pie").replaceChildren(...botones);
  if (!dlg.open) dlg.showModal();
}

// ------------------------------------------------------------------------- //
// Inicio
// ------------------------------------------------------------------------- //
async function vInicio(m) {
  const [al, progs] = await Promise.all([api("GET", "alertas"), api("GET", "programaciones")]);
  const cuenta = n => (D[n] || []).filter(x => x.activo !== false).length;
  const venc = al.puntos.filter(p => p.nivel === "vencido").length, prox = al.puntos.filter(p => p.nivel === "proximo").length;
  m.append(
    h("div", {class: "panel"}, h("div", {class: "kpis"},
      ...[["Puntos activos", cuenta("puntos")], ["Personal", cuenta("personal")], ["Vehículos", cuenta("vehiculos")],
        ["Equipos", cuenta("equipos")], ["Puntos vencidos", venc], ["Vencen en 30 días", prox]]
        .map(([t, n]) => h("div", {class: "kpi"}, h("b", {}, String(n)), h("span", {}, t)))),
      h("div", {class: "fila", style: "margin-top:14px"},
        h("button", {class: "primario", onclick: () => ir("planificar")}, "Generar programación"),
        progs[0] ? h("button", {onclick: () => ir("plan", {prog: progs[0].id})}, `Abrir última: ${progs[0].nombre}`) : null,
        !D.puntos.length ? h("button", {onclick: cargarDemo}, "Cargar datos de ejemplo") : null)),
    h("div", {class: "grid2"},
      h("div", {class: "panel"}, h("h2", {}, "Vencimientos de personal, vehículos y equipos"),
        al.vencimientos.length ? tabla(["", "Tipo", "Quién", "Qué", "Estado"], al.vencimientos.map(v =>
          [h("span", {class: "chip " + v.nivel}, v.nivel === "vencido" ? "Vencido" : "Próximo"), v.grupo, v.quien, v.que, v.texto]))
          : h("p", {class: "muted"}, "Sin vencimientos en los próximos 30 días.")),
      h("div", {class: "panel"}, h("h2", {}, "Puntos según su frecuencia"),
        h("div", {class: "tabla-scroll", style: "max-height:420px;overflow:auto"},
          tabla(["Código", "Frecuencia", "Último", "Estado"], al.puntos.map(p =>
            [p.codigo, p.frecuencia, fechaCorta(p.ultimo), h("span", {class: "chip " + p.nivel}, p.texto)]))))));
}
async function cargarDemo() {
  if (!confirm("Se cargarán datos de ejemplo y reemplazarán los actuales. ¿Continuar?")) return;
  D = await conCarga($("#main"), () => api("POST", "demo")); toast("Datos de ejemplo cargados"); ir("inicio");
}
function tabla(cabeceras, filas, alClic) {
  return h("div", {class: "tabla-scroll"}, h("table", {},
    h("thead", {}, h("tr", {}, cabeceras.map(c => h("th", {}, c)))),
    h("tbody", {}, filas.map((f, i) => h("tr", alClic ? {class: "clic", onclick: () => alClic(i)} : {},
      f.map(v => h("td", {}, v)))))));
}

// ------------------------------------------------------------------------- //
// Registros (personal, vehículos, equipos, puntos, alojamientos)
// ------------------------------------------------------------------------- //
const COLUMNAS = {
  personal: ["nombre", "cargo", "competencias", "conduce", "habilitado_hasta", "activo"],
  vehiculos: ["placa", "descripcion", "capacidad", "es_4x4", "rendimiento_km_l", "costo_dia", "documentos_hasta", "activo"],
  equipos: ["codigo", "tipo", "descripcion", "calibracion_vence", "activo"],
  puntos: ["codigo", "nombre", "matriz", "duracion_min", "prioridad", "frecuencia", "ultimo_monitoreo", "activo"],
  alojamientos: ["nombre", "lat", "lon", "costo_noche_persona", "activo"],
};
const COLOR_MATRIZ = {agua: "#2563eb", aire: "#64748b", suelo: "#92400e", ruido: "#9333ea", sedimento: "#a16207",
  biologico: "#16a34a", efluente: "#dc2626"};
function fmtValor(v) {
  if (typeof v === "boolean") return v ? "Sí" : "No";
  if (Array.isArray(v)) return v.join(", ");
  if (typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v)) return fechaCorta(v);
  return String(v ?? "");
}
function vEntidad(m, ent) {
  const esq = E.entidades[ent], lista = D[ent];
  const campos = Object.fromEntries(esq.campos.map(c => [c.nombre, c]));
  const filtro = h("input", {placeholder: "Buscar…", oninput: () => pintar()});
  const cuerpo = h("div");
  const archivo = h("input", {type: "file", accept: ".csv,.txt", style: "display:none", onchange: importar});
  const mapaDiv = ["puntos", "alojamientos"].includes(ent) ? h("div", {class: "mapa"}) : null;
  m.append(h("div", {class: "panel"},
    h("div", {class: "fila entre"}, h("h2", {}, `${esq.titulo} (${lista.length})`),
      h("div", {class: "fila"}, filtro,
        h("button", {class: "primario", onclick: () => editar(null)}, "+ Agregar"),
        h("button", {onclick: () => archivo.click()}, "Importar CSV"), archivo,
        h("a", {class: "boton", href: `/api/csv/${ent}`}, "Exportar CSV"))),
    h("p", {class: "muted chico"}, `Haga clic en una fila para editar. El CSV exportado se puede editar en Excel y volver a importar (se actualiza por ${esq.clave}).`),
    cuerpo), mapaDiv ? h("div", {class: "panel"}, mapaDiv) : null);
  function pintar() {
    const q = filtro.value.toLowerCase();
    const vis = lista.map((x, i) => [x, i]).filter(([x]) => !q || JSON.stringify(x).toLowerCase().includes(q));
    cuerpo.replaceChildren(tabla(COLUMNAS[ent].map(n => campos[n]?.etiqueta ?? n),
      vis.map(([x]) => COLUMNAS[ent].map(n => n === "matriz"
        ? h("span", {class: "chip", style: `color:${COLOR_MATRIZ[x[n]]}`}, x[n]) : fmtValor(x[n]))),
      k => editar(vis[k][1])));
  }
  pintar();
  if (mapaDiv && window.L) setTimeout(() => {
    const mp = L.map(mapaDiv); capaBase(mp);

    h("div", {class: "fila"}, h("button", {class: "primario", onclick: generar}, "Generar"),
      h("button", {onclick: verMatriz}, "Ver matriz de tiempos")));
  m.append(panel);
  async function generar() {

    toast("Planificando…", 20000);

    if (!libres.length) return null;
    const s = h("select", {}, h("option", {value: ""}, "Agregar punto a la programación…"),
      libres.map(p => h("option", {value: p.codigo}, `${p.codigo} — ${p.nombre}`)));
    s.addEventListener("change", () => { if (!s.value) return; const p = D.puntos.find(z => z.codigo === s.value);
      const d = copia(); d.pendientes.push({codigo: p.codigo, tipo: p.horas_exposicion > 0 ? "instalacion" : "muestreo",
        motivo: "agregado manualmente"}); recalcular(d); });
    return s;
  }

  let rutas = null;
  async function cargarRutas() {
    try { rutas = await api("GET", `programacion/${pid}/trazados`); dibujarMapa(); } catch (e) { /* sin rutas: puntos solos */ }
  }
  function dibujarMapa() {
    if (!mapa) return;
    if (capa) capa.remove();
    capa = L.layerGroup().addTo(mapa);
    const c = D.config, limites = [[c.base_lat, c.base_lon]];
    L.marker(limites[0]).addTo(capa).bindTooltip(c.base_nombre);
    if (c.usar_laboratorio && (c.lab_lat || c.lab_lon)) L.marker([c.lab_lat, c.lab_lon]).addTo(capa).bindTooltip(c.lab_nombre);
    for (const a of D.alojamientos) L.circleMarker([a.lat, a.lon], {radius: 6, color: "#7c3aed"}).addTo(capa).bindTooltip("🛏 " + a.nombre);
    // Trazado por carretera de la versión guardada; con cambios sin guardar, rectas entre paradas.
    const conRutas = rutas && !estado.sucio && rutas.length === V.dias.length;
    for (const v of V.dias) {
      const r = conRutas ? rutas[v.indice] : null;
      L.polyline(r ? r.linea : v.paradas, {color: v.color, weight: 4, opacity: .75,
        dashArray: !r || r.recta ? "6" : null}).addTo(capa);
    }
    const porCod = Object.fromEntries(D.puntos.map(p => [p.codigo, p]));
    V.dias.forEach(v => V.plan.dias[v.indice].tareas.forEach((t, j) => {
      const p = porCod[t.codigo]; if (!p) return;
      limites.push([p.lat, p.lon]);
      L.circleMarker([p.lat, p.lon], {radius: 8, color: v.color, fillOpacity: .85}).addTo(capa)
        .bindTooltip(`${p.codigo} · ${fechaCorta(V.plan.dias[v.indice].fecha)} ${V.plan.dias[v.indice].cuadrilla} #${j + 1}`);
    }));
    for (const t of V.pendientes) { const p = porCod[t.codigo]; if (p) { limites.push([p.lat, p.lon]);
      L.circleMarker([p.lat, p.lon], {radius: 7, color: "#6b7280", dashArray: "3"}).addTo(capa).bindTooltip(`${p.codigo} (sin programar)`); } }
    if (!mapa._ajustado) { mapa.fitBounds(limites, {padding: [30, 30], maxZoom: 13}); mapa._ajustado = true; }
  }
  pintar();
  cargarRutas();
}

// ------------------------------------------------------------------------- //
(async function arranque() {
  try { [E, D] = await Promise.all([api("GET", "esquemas"), api("GET", "datos")]); }
  catch (e) { $("#main").append(h("div", {class: "error"}, "No se pudo conectar con el programa: " + e.message)); return; }
  const [v, id] = location.hash.slice(1).split("/");
  ir(VISTAS.some(([k]) => k === v) || (v === "plan" && id) ? v : "inicio", id ? {prog: decodeURIComponent(id)} : undefined);
})();
</script>
